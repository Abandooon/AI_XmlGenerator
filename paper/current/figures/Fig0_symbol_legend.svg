<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710">
<title>统一图形语义与绘制规范</title>
<desc>中文学术流程图。圆角矩形为处理步骤，矩形为结构化数据，折角文件为文档，菱形为判断。实线箭头为数据流，虚线箭头为控制流；无箭头线为明确标注的信息关联。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="25" y="42.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#111111">形状含义</text>
<rect x="30" y="80" width="165" height="68" rx="14" fill="#E6E6E6" stroke="#333333" stroke-width="1.8"/>
<text x="112.5" y="122.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="225" y="121.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111111">处理步骤</text>
<text x="525" y="121.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">执行计算、调用工具、人工处理；执行者写在框内</text>
<rect x="30" y="180" width="165" height="68" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="112.5" y="222.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="225" y="221.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111111">模型或结构化数据</text>
<text x="525" y="221.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">元模型、ICM、约束、配置、候选模型及数据记录</text>
<path d="M30 280 H174.6 L195 300.4 V348 H30 Z M174.6 280 V300.4 H195" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="112.5" y="326.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="225" y="321.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111111">文档、输入或报告</text>
<text x="525" y="321.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">需求文本、规范片段、未支持事项记录及输出报告</text>
<path d="M112.5 380 L195 414.0 L112.5 448 L30 414.0 Z" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="112.5" y="422.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="225" y="421.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#111111">判断</text>
<text x="525" y="421.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">根据明确条件分支；出边标注条件或“是／否”</text>
<path d="M25 480 H1175" stroke="#BBBBBB" stroke-width="1" fill="none"/>
<text x="25" y="520.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#111111">连线含义</text>
<path d="M35 561 L165 561" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<path d="M155.0 566.0 L165 561 L155.0 556.0" stroke="#333333" stroke-width="1.8" fill="none"/>
<text x="195" y="570.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">数据流：传递输入、模型、配置或处理结果</text>
<path d="M35 611 L165 611" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter" stroke-dasharray="8 6"/>
<path d="M155.0 616.0 L165 611 L155.0 606.0" stroke="#333333" stroke-width="1.8" fill="none"/>
<text x="195" y="620.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">控制流：调用、执行分支、继续、重试或终止</text>
<path d="M35 661 L165 661" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="195" y="670.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#111111">信息关联：仅用于信息模型图，连线注明关系；不表示执行顺序</text>
</svg>