<text x="875" y="283" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">结构信息</text>
<rect x="120" y="428" width="425" height="175" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="332.5" y="524.25" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="332.5" y="468.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#111111">约束用途（可重叠）</text>
<text x="140" y="513" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">约束生成内容</text>
<text x="140" y="548" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">提供检索内容</text>
<text x="140" y="583" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">辅助编写检查器</text>
<rect x="670" y="428" width="505" height="175" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="922.5" y="524.25" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="922.5" y="468.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#111111">检查实现关联信息</text>
<text x="690" y="513" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">工具标识与对应规则</text>
<text x="690" y="548" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">已有工具或人工编写</text>
<text x="690" y="583" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">可用性与覆盖范围</text>
<path d="M25 630 H1175" stroke="#BBBBBB" stroke-width="1" fill="none"/>
<text x="25" y="667.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#111111">图例</text>
<rect x="100" y="645" width="75" height="36" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="137.5" y="669.3" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="190" y="670.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#111111">信息对象</text>
<path d="M400 660 L470 660" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="488" y="670.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#111111">信息关联（见连线标注）</text>
<text x="1175" y="670.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="end" fill="#111111">不限定具体存储形式</text>
</svg>