<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<title>ICM 信息对象与关联</title>
<desc>中文学术流程图。圆角矩形为处理步骤，矩形为结构化数据，折角文件为文档，菱形为判断。实线箭头为数据流，虚线箭头为控制流；无箭头线为明确标注的信息关联。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<path d="M1015 128 L1015 60 L185 60 L185 128" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="600" y="47.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#111111">来源</text>
<path d="M440 230 L345 230" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="392" y="216.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#111111">来源</text>
<path d="M760 230 L855 230" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="808" y="216.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#111111">关联</text>
<path d="M520 318 L520 374 L332 374 L332 428" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="417" y="360.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#111111">用途</text>
<path d="M680 318 L680 374 L922 374 L922 428" stroke="#333333" stroke-width="1.8" fill="none" stroke-linejoin="miter"/>
<text x="818" y="360.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#111111">实现对应</text>
<rect x="25" y="128" width="320" height="190" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="185.0" y="231.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="185.0" y="168.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#111111">来源记录</text>
<text x="45" y="213" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">规范或元模型文件</text>
<text x="45" y="248" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">版本与来源位置</text>
<text x="45" y="283" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">原始内容</text>
<rect x="440" y="128" width="320" height="190" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="600.0" y="231.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="600.0" y="168.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#111111">约束记录</text>
<text x="460" y="213" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">规则标识与内容</text>
<text x="460" y="248" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">适用条件与作用对象</text>
<text x="460" y="283" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">复核状态与关联状态</text>
<rect x="855" y="128" width="320" height="190" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.8"/>
<text x="1015.0" y="231.75" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#111111"></text>
<text x="1015.0" y="168.0" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#111111">元模型元素</text>
<text x="875" y="213" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#111111">元素标识与类型</text>
