# config/system_config.yaml
cloud_service:
  host: "0.0.0.0"
  port: 8000

model:
  name: "deepseek-ai/deepseek-coder-33b-instruct"
  max_model_len: 4096  # 减小以适应GPU内存
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.8
  trust_remote_code: true

constraints:
  fsm_file: "/opt/autosar_vllm_system/artifacts/autosar.fsm"
  gbnf_file: "/opt/autosar_vllm_system/artifacts/autosar.gbnf"
  allowed_tokens_file: "/opt/autosar_vllm_system/artifacts/autosar_allowed_tokens.py"

validation:
  shacl_shapes_file: "/opt/autosar_vllm_system/artifacts/autosar_shapes.ttl"
  smt_template_file: "/opt/autosar_vllm_system/artifacts/constraints.smt2"

logging:
  level: "INFO"
  file: "/opt/autosar_vllm_system/logs/system.log"