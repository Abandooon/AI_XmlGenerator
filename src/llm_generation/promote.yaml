min_promote_rag:
  - |
    请为 AUTOSAR 4.2 生成一份合法的 json：
    • 创建 Application-SW 组件 `ASW_COM_MIN`
    • 仅包含一个 P-PORT `MCU01_EmergShutDown`
      - 提供信号 `MCU01_EmergShutDown`
      - 可引用 SENDER-RECEIVER-INTERFACE：
        /COM_Interface/SR_Interface_MCU01_EmergShutDown、
        /COM_Interface/SR_Interface_MCU02_MaxTor、
        /COM_Interface/SR_Interface_MCU03_NRF_IdcSamp
    • 无需任何 Runnable 或 RequiredPort
    • 下面是一份示例xml供参考：
      ```json
      {
        "APPLICATION-SW-COMPONENT-TYPE": {
          "SHORT-NAME": "ASW_COM_MIN",
          "PORTS": {
            "P-PORT-PROTOTYPE": [
              {
                "SHORT-NAME": "PPort_MCU01_EmergShutDown",
                "PROVIDED-INTERFACE-TREF": {
                  "@DEST": "SENDER-RECEIVER-INTERFACE",
                  "#text": "/Interface/SR_Interface_MCU01_EmergShutDown"
                }
              }
            ]
          }
        }
      }
      ```
