# ===== LLM API 配置 =====
llm:
  model_name: "gemini-2.5-pro-preview-06-05"        # Gemini模型名称
  llm_api_url: "https://api.openai-proxy.org/google" # API代理地址
  api_key: "sk-FDcLPqAYJeas9C5h5vdKVfFVFh2v4cO99k06zaviDGLLV8UJ"  # API密钥
  temperature: 0.7                                   # 生成温度参数
  max_output_tokens: 100000                         # 提升到100K - 利用Gemini长输出能力
  max_context_tokens: 2000000                       # 提升到2M - Gemini支持2M上下文
  # 文件上传功能开关（使用代理API时建议关闭）
  enable_file_upload: false

# ===== 对话系统配置 =====
conversation:
  session_ttl: 86400                                # 会话存活时间（秒）- 24小时
  enable_memory: true                               # 启用会话记忆功能

# ===== 内存管理配置 =====
memory:
  session_ttl: 86400                               # 会话超时时间（秒）
  max_session_history: 20                          # 最大会话历史记录数
  enable_user_preferences: true                    # 启用用户偏好学习
  storage_backend: "memory"                        # 存储后端：memory/redis
  cache_size: 100                                  # 缓存大小

# ===== 知识图谱配置 =====
knowledge_graph:
  neo4j_uri: "neo4j://127.0.0.1:7687"              # Neo4j数据库连接URI
  neo4j_password: "542394665"                       # Neo4j密码
  neo4j_user: "neo4j"
  max_safety_depth: 100                            # 提升安全深度，允许更深的Schema

# ===== 约束引擎配置 =====
constraint_engine:
  enabled: false                    # 是否启用约束引擎（关闭可节省token）
  max_constraints_per_type: 3       # 每个类型最多返回的约束数量
  constraint_types:                 # 要包含的约束类型
    - MODEL_OCL                     # 模型约束
    - DATA_TYPE                     # 数据类型约束
  exclude_standard_constraints: false  # 是否排除通用约束

# ===== standard_types配置 =====
standard_types:
  standard_types_path: "src/llm_generation/standard_types/data"

# ===== Schema生成配置 =====
schema_generation:
  # 终止条件配置
  termination_rules:
    ref_suffixes: ["-REF", "-TREF", "-IREF"]       # 引用类型后缀
    standard_prefixes: ["/AUTOSAR/", "/DataTypes/"] # 标准类型前缀

  # 缓存配置
  cache_config:
    enable_request_cache: true                      # 启用请求级缓存
    enable_application_cache: true                  # 启用应用级缓存
    application_cache_ttl: 7200                     # 提升缓存时间到2小时
    max_cache_size: 500                            # 增大缓存容量

  # 性能控制
  performance:
    query_timeout: 60                               # 增加查询超时
    max_properties_per_object: 5000                 # 允许更多属性
    parallel_query: true                            # 启用并行查询

# ===== 生成策略配置（核心优化） =====
generation:
  single_batch_threshold: 25                        # 大幅提升到25个组件
  max_batch_size: 15                               # 增大单批最大容量
  enable_semantic_placeholders: false               # 关闭语义占位符，直接处理完整引用
  reference_resolution_timeout: 600                 # 增加引用解析超时
  enable_direct_reference: true                     # 新增：启用直接引用模式
  max_schema_injection_depth: 100                    # 新增：Schema注入深度

# ===== 语义解析配置（简化） =====
semantic_resolution:
  # 简化语义解析，因为不再主要依赖语义占位符
  enabled: false                                    # 默认关闭语义解析
  identifiers: ["引用"]                            # 最小化标识符集合
  patterns: []                                      # 清空模式列表
  fuzzy_match_threshold: 0.9                       # 提高匹配阈值
  enable_heuristic_resolution: false               # 关闭启发式解析
  resolution_cache_size: 100                       # 减小缓存

# Round1 架构设计Schema配置 - 基于round1.json元模型
round1_schema:
  # 基于round1.json中的SW-COMPONENT-TYPE定义
  component_types:
    # 从round1.json提取的具体组件类型
    allowed_types:
      - "APPLICATION-SW-COMPONENT-TYPE"
      - "COMPLEX-DEVICE-DRIVER-SW-COMPONENT-TYPE"
      - "ECU-ABSTRACTION-SW-COMPONENT-TYPE"
      - "NV-BLOCK-SW-COMPONENT-TYPE"
      - "SENSOR-ACTUATOR-SW-COMPONENT-TYPE"
      - "SERVICE-PROXY-SW-COMPONENT-TYPE"
      - "SERVICE-SW-COMPONENT-TYPE"
      - "COMPOSITION-SW-COMPONENT-TYPE"
      - "PARAMETER-SW-COMPONENT-TYPE"

    # 基于round1.json中SW-COMPONENT-TYPE的必需属性(min_occurs=1)
    required_attributes:
      - "SHORT-NAME"  # min_occurs: 1, max_occurs: 1

    # 基于round1.json中SW-COMPONENT-TYPE的可选属性(min_occurs=0)
    optional_attributes:
      - "PORTS"                    # min_occurs: 0, max_occurs: -1
      - "SW-COMPONENT-DOCUMENTATION" # min_occurs: 0, max_occurs: -1
      - "CONSISTENCY-NEEDS"        # min_occurs: 0, max_occurs: -1
      - "PORT-GROUP"               # min_occurs: 0, max_occurs: -1
      - "UNIT-GROUP-REF"           # min_occurs: 0, max_occurs: -1
      - "DESC"                     # min_occurs: 0, max_occurs: 1
      - "CATEGORY"                 # min_occurs: 0, max_occurs: 1
      - "ADMIN-DATA"               # min_occurs: 0, max_occurs: 1
      - "ANNOTATION"               # min_occurs: 0, max_occurs: -1

  # Round1架构设计增强配置
  round1_element_design:
    # 端口类型定义
    port_types:
      - name: "P-PORT-PROTOTYPE"
        description: "Provided port for sending data"
      - name: "R-PORT-PROTOTYPE"
        description: "Required port for receiving data"
      - name: "PR-PORT-PROTOTYPE"
        description: "Provided-Required port for bidirectional"

    # 事件类型定义（基于ports_events.json）
    event_types:
      - name: "TIMING-EVENT"
        description: "Periodic time-triggered event"
      - name: "DATA-RECEIVED-EVENT"
        description: "Triggered when data is received"
      - name: "DATA-SEND-COMPLETED-EVENT"
        description: "Triggered when data send completes"
      - name: "OPERATION-INVOKED-EVENT"
        description: "Triggered when operation is called"
      - name: "MODE-SWITCH-EVENT"
        description: "Triggered on mode changes"
      - name: "INIT-EVENT"
        description: "Initialization event"
      - name: "DATA-RECEIVE-ERROR-EVENT"
        description: "Error in data reception"
      - name: "ASYNCHRONOUS-SERVER-CALL-RETURNS-EVENT"
        description: "Async server call completion"
      - name: "BACKGROUND-EVENT"
        description: "Background processing event"
      - name: "DATA-WRITE-COMPLETED-EVENT"
        description: "Data write completion"
      - name: "EXTERNAL-TRIGGER-OCCURRED-EVENT"
        description: "External trigger"
      - name: "INTERNAL-TRIGGER-OCCURRED-EVENT"
        description: "Internal trigger"
      - name: "MODE-SWITCHED-ACK-EVENT"
        description: "Mode switch acknowledgment"
      - name: "SWC-MODE-MANAGER-ERROR-EVENT"
        description: "Mode manager error"
      - name: "TRANSFORMER-HARD-ERROR-EVENT"
        description: "Transformer error"

    # 新增：RunnableEntity详细配置
    runnable_entity_config:
      required_elements:
        - "SHORT-NAME"                    # 继承自Identifiable
        - "SYMBOL"                         # RunnableEntity必需
        - "MINIMUM-START-INTERVAL"        # 继承自ExecutableEntity
      optional_elements:
        - "CAN-BE-INVOKED-CONCURRENTLY"
        - "ARGUMENTS"
        - "ASYNCHRONOUS-SERVER-CALL-RESULT-POINTS"
        - "DATA-READ-ACCESSS"
        - "DATA-RECEIVE-POINT-BY-ARGUMENTS"
        - "DATA-RECEIVE-POINT-BY-VALUES"
        - "DATA-SEND-POINTS"
        - "DATA-WRITE-ACCESSS"
        - "EXTERNAL-TRIGGERING-POINTS"
        - "INTERNAL-TRIGGERING-POINTS"
        - "MODE-ACCESS-POINTS"
        - "MODE-SWITCH-POINTS"
        - "PARAMETER-ACCESSS"
        - "READ-LOCAL-VARIABLES"
        - "SERVER-CALL-POINTS"
        - "WAIT-POINTS"
        - "WRITTEN-LOCAL-VARIABLES"
        # 继承自ExecutableEntity的可选元素
        - "ACTIVATION-REASONS"
        - "CAN-ENTER-EXCLUSIVE-AREA-REFS"
        - "EXCLUSIVE-AREA-NESTING-ORDER-REFS"
        - "REENTRANCY-LEVEL"
        - "RUNS-INSIDE-EXCLUSIVE-AREA-REFS"
        - "SW-ADDR-METHOD-REF"

  # 修改理由：需要让Round1能够选择具体的端口和事件类型，而不是简单的true/false

  # 基于round1.json中的PORT-INTERFACE定义
  interface_types:
    # 从round1.json提取的具体接口类型
    allowed_types:
      - "CLIENT-SERVER-INTERFACE"
      - "NV-DATA-INTERFACE"
      - "PARAMETER-INTERFACE"
      - "SENDER-RECEIVER-INTERFACE"
      - "MODE-SWITCH-INTERFACE"
      - "TRIGGER-INTERFACE"

    # 基于round1.json中PORT-INTERFACE的必需属性
    required_attributes:
      - "SHORT-NAME"  # min_occurs: 1, max_occurs: 1
      - "IS-SERVICE"  # min_occurs: 1, max_occurs: 1

    # 基于round1.json中PORT-INTERFACE的可选属性
    optional_attributes:
      - "SERVICE-KIND"      # min_occurs: 0, max_occurs: 1
      - "DESC"              # min_occurs: 0, max_occurs: 1
      - "CATEGORY"          # min_occurs: 0, max_occurs: 1
      - "ADMIN-DATA"        # min_occurs: 0, max_occurs: 1
      - "ANNOTATION"        # min_occurs: 0, max_occurs: -1

  # 基于round1.json中的MODE-DECLARATION-GROUP定义
  mode_declaration_group:
    required_attributes:
      - "SHORT-NAME"        # min_occurs: 1, max_occurs: 1
      - "INITIAL-MODE-REF"  # min_occurs: 1, max_occurs: 1
      - "MODE-DECLARATION"  # min_occurs: 1, max_occurs: -1

    optional_attributes:
      - "MODE-TRANSITION"              # min_occurs: 0, max_occurs: -1
      - "MODE-MANAGER-ERROR-BEHAVIOR"  # min_occurs: 0, max_occurs: 1
      - "MODE-USER-ERROR-BEHAVIOR"     # min_occurs: 0, max_occurs: 1
      - "ON-TRANSITION-VALUE"          # min_occurs: 0, max_occurs: 1

  # Round1输出格式定义 - 映射到round1.json的元素
  output_schema:
    system_analysis:
      required_fields: []  # Round1不直接对应round1.json，这是架构分析
      optional_fields: ["functional_decomposition", "data_flow_analysis"]

    component_plan:
      # 每个组件必须指定类型（基于round1.json的组件类型）
      required_fields: ["name", "type"]  # type必须是allowed_types之一
      optional_fields: ["purpose", "ports_needed", "behaviors_needed"]

    interface_plan:
      # 每个接口必须指定类型（基于round1.json的接口类型）
      required_fields: ["name", "type"]  # type必须是allowed_types之一
      optional_fields: ["is_service", "connected_components"]

# 元模型注入配置（大幅增强）
metamodel_injection:
  round1_depth: 3                                  # Round1也注入更多信息
  round2_depth: 15                                 # 大幅增加Round2深度
  include_required_attributes: true
  include_min_occurs: true
  include_inheritance_chain: true                  # 新增：包含继承链
  include_all_children: true                       # 新增：包含所有子元素
  max_element_expansion: 1000                      # 新增：最大元素展开数

# ===== 批处理优化配置（新增） =====
batch_optimization:
  enable_intelligent_grouping: true                # 智能分组
  prefer_single_batch: true                        # 优先单批生成
  component_complexity_weights:                    # 组件复杂度权重
    SIMPLE: 1
    MEDIUM: 3
    COMPLEX: 5
  max_complexity_per_batch: 50                     # 每批最大复杂度总和

# ===== 术语库配置 =====
terminology:
  # 组件类型定义
  component_types:
    - name: "APPLICATION-SW-COMPONENT-TYPE"
      description: "应用软件组件类型，实现业务逻辑和算法处理"
      scenarios:
        - "业务逻辑处理"
        - "算法计算"
        - "数据处理"
        - "控制逻辑"
        - "状态管理"
      complexity: "Medium"

    - name: "SENSOR-ACTUATOR-SW-COMPONENT-TYPE"
      description: "传感器执行器组件类型，处理硬件接口和I/O操作"
      scenarios:
        - "传感器数据采集"
        - "执行器控制"
        - "硬件抽象"
        - "I/O处理"
        - "信号转换"
      complexity: "Simple"

    - name: "COMPOSITION-SW-COMPONENT-TYPE"
      description: "组合组件类型，协调多个子组件的交互"
      scenarios:
        - "组件编排"
        - "系统集成"
        - "复杂业务流程"
        - "多组件协调"
        - "架构组织"
      complexity: "Complex"

    - name: "PARAMETER-SW-COMPONENT-TYPE"
      description: "参数组件类型，管理配置参数和标定数据"
      scenarios:
        - "参数配置"
        - "标定数据管理"
        - "运行时参数"
        - "系统设置"
      complexity: "Simple"

  # 接口类型定义
  interface_types:
    - name: "SENDER-RECEIVER-INTERFACE"
      description: "发送接收接口，用于异步数据传输和信号通信"
      communication_mode: "异步"
      scenarios:
        - "传感器数据传输"
        - "状态信息广播"
        - "事件通知"
        - "周期性数据更新"
        - "信号传递"

    - name: "CLIENT-SERVER-INTERFACE"
      description: "客户端服务端接口，用于同步服务调用和请求响应"
      communication_mode: "同步"
      scenarios:
        - "服务请求响应"
        - "远程过程调用"
        - "查询操作"
        - "控制指令"
        - "配置设置"

    - name: "MODE-SWITCH-INTERFACE"
      description: "模式切换接口，用于系统状态和运行模式管理"
      communication_mode: "事件驱动"
      scenarios:
        - "系统状态切换"
        - "运行模式管理"
        - "电源模式控制"
        - "操作模式变更"

    - name: "NV-DATA-INTERFACE"
      description: "非易失性数据接口，用于持久化数据存储和恢复"
      communication_mode: "同步"
      scenarios:
        - "配置数据存储"
        - "历史数据保存"
        - "参数持久化"
        - "故障信息记录"

  # 设计模式定义（简化）
  design_patterns:
    - name: "统一批次生成模式"
      components: ["ALL"]
      interfaces: ["ALL"]
      scenarios:
        - "利用长上下文一次性生成所有组件"
        - "保持引用一致性"
        - "减少批次切换开销"

# ===== 系统配置 =====
debug_mode: true
output_dir: "src/llm_generation/output"