# ===== LLM API 配置 =====
llm:
  model_name: "gemini-2.5-pro-preview-06-05"        # Gemini模型名称
  llm_api_url: "https://api.openai-proxy.org/google" # API代理地址
  api_key: "sk-FDcLPqAYJeas9C5h5vdKVfFVFh2v4cO99k06zaviDGLLV8UJ"  # API密钥（也可通过环境变量设置）
  temperature: 0.7                                   # 生成温度参数
  max_output_tokens: 60000                          # 最大输出Token数
  max_context_tokens: 200000                        # 最大上下文Token数

# ===== 对话系统配置 =====
conversation:
  session_ttl: 86400                                # 会话存活时间（秒）- 24小时
  enable_memory: true                               # 启用会话记忆功能

# ===== 知识图谱配置 =====
knowledge_graph:
  neo4j_uri: "neo4j+s://d4f0265c.databases.neo4j.io"                # Neo4j数据库连接URI
  neo4j_password: "1ABs4OWM7B0V1wOTc5FZEpYaNSsCuOFuJmDRrsVeoiE"           # Neo4j密码（可通过环境变量设置）
  neo4j_user: "neo4j"
  max_schema_depth: 7                               # XML Schema最大递归深度

# ===== standard_types配置 =====
standard_types:
  standard_types_path: "src/llm_generation/standard_types/data"  # 标准类型文件目录


# ===== 生成策略配置 =====
generation:
  single_batch_threshold: 5              # 单批生成阈值：<=5个组件时单批生成
  max_batch_size: 8                      # 最大批次大小：每批最多8个组件
  enable_semantic_placeholders: true     # 启用语义占位符
  reference_resolution_timeout: 300      # 引用解析超时时间（秒）

# ===== 语义解析配置 =====
semantic_resolution:
  # 语义引用标识符（用于判断是否为语义引用）
  identifiers:
    - "引用"
    - "连接到"
    - "订阅"
    - "绑定到"
    - "使用"
    - "提供"

  # 语义解析模式
  patterns:
    - pattern: "引用(.+?)的(.+?)端口"
      type: "port_reference"
      template: "/{component}/Ports/{target}"

    - pattern: "连接到(.+?)的(.+?)接口"
      type: "interface_reference"
      template: "/{component}/Interfaces/{target}"

    - pattern: "订阅(.+?)管理器的(.+?)事件"
      type: "event_reference"
      template: "/{component}/Events/{target}"

    - pattern: "绑定到(.+?)的(.+?)事件"
      type: "runnable_reference"
      template: "/{component}/InternalBehavior/Runnables/{target}"

    - pattern: "使用(.+?)提供的(.+?)服务"
      type: "service_reference"
      template: "/{component}/Services/{target}"

  # 功能映射（用于组件名称推断）
  function_mappings:
    温度: ["temp", "temperature", "thermal"]
    传感器: ["sensor", "detect", "monitor"]
    控制器: ["controller", "control", "manager"]
    处理器: ["processor", "process", "handler"]
    管理器: ["manager", "mgr", "supervisor"]
    电机: ["motor", "engine", "actuator"]
    泵: ["pump", "valve"]
    显示: ["display", "hmi", "screen"]

  # 解析配置
  fuzzy_match_threshold: 0.6
  enable_heuristic_resolution: true
  resolution_cache_size: 1000

# Round1架构设计Schema配置
round1_schema:
  system_analysis:
    required:
      - functional_decomposition
      - data_flow_analysis
    optional:
      - timing_requirements
      - scalability_considerations

  component_plan:
    required_fields:
      - component_id
      - name
      - type
      - purpose
    optional_fields:
      - estimated_complexity
      - port_estimates
      - behavioral_characteristics

    allowed_types:
      - APPLICATION-SW-COMPONENT-TYPE
      - SENSOR-ACTUATOR-SW-COMPONENT-TYPE
      - COMPLEX-DEVICE-DRIVER-SW-COMPONENT-TYPE
      - ECU-ABSTRACTION-SW-COMPONENT-TYPE
      - NV-BLOCK-SW-COMPONENT-TYPE
      - SERVICE-PROXY-SW-COMPONENT-TYPE
      - SERVICE-SW-COMPONENT-TYPE
      - COMPOSITION-SW-COMPONENT-TYPE
      - PARAMETER-SW-COMPONENT-TYPE

  interface_plan:
    required_fields:
      - interface_id
      - name
      - type
      - communication_pattern
    optional_fields:
      - data_category
      - connected_components
      - performance_requirements

    allowed_types:
      - SENDER-RECEIVER-INTERFACE
      - CLIENT-SERVER-INTERFACE
      - NV-DATA-INTERFACE
      - PARAMETER-INTERFACE
      - MODE-SWITCH-INTERFACE
      - TRIGGER-INTERFACE

# 元模型注入配置
metamodel_injection:
  # Round1注入深度：只注入具体类型
  round1_depth: 1
  # Round2注入深度：基于LLM选择注入2-3层
  round2_depth: 8
  # 是否包含必需属性说明
  include_required_attributes: true
  # 是否包含minOccurs信息
  include_min_occurs: true

# ===== 术语库配置 =====
terminology:
  # 组件类型定义
  component_types:
    - name: "APPLICATION-SW-COMPONENT-TYPE"
      description: "应用软件组件类型，实现业务逻辑和算法处理"
      scenarios:
        - "业务逻辑处理"
        - "算法计算"
        - "数据处理"
        - "控制逻辑"
        - "状态管理"
      complexity: "Medium"

    - name: "SENSOR-ACTUATOR-SW-COMPONENT-TYPE"
      description: "传感器执行器组件类型，处理硬件接口和I/O操作"
      scenarios:
        - "传感器数据采集"
        - "执行器控制"
        - "硬件抽象"
        - "I/O处理"
        - "信号转换"
      complexity: "Simple"

    - name: "COMPOSITION-SW-COMPONENT-TYPE"
      description: "组合组件类型，协调多个子组件的交互"
      scenarios:
        - "组件编排"
        - "系统集成"
        - "复杂业务流程"
        - "多组件协调"
        - "架构组织"
      complexity: "Complex"

    - name: "PARAMETER-SW-COMPONENT-TYPE"
      description: "参数组件类型，管理配置参数和标定数据"
      scenarios:
        - "参数配置"
        - "标定数据管理"
        - "运行时参数"
        - "系统设置"
      complexity: "Simple"

  # 接口类型定义
  interface_types:
    - name: "SENDER-RECEIVER-INTERFACE"
      description: "发送接收接口，用于异步数据传输和信号通信"
      communication_mode: "异步"
      scenarios:
        - "传感器数据传输"
        - "状态信息广播"
        - "事件通知"
        - "周期性数据更新"
        - "信号传递"

    - name: "CLIENT-SERVER-INTERFACE"
      description: "客户端服务端接口，用于同步服务调用和请求响应"
      communication_mode: "同步"
      scenarios:
        - "服务请求响应"
        - "远程过程调用"
        - "查询操作"
        - "控制指令"
        - "配置设置"

    - name: "MODE-SWITCH-INTERFACE"
      description: "模式切换接口，用于系统状态和运行模式管理"
      communication_mode: "事件驱动"
      scenarios:
        - "系统状态切换"
        - "运行模式管理"
        - "电源模式控制"
        - "操作模式变更"

    - name: "NV-DATA-INTERFACE"
      description: "非易失性数据接口，用于持久化数据存储和恢复"
      communication_mode: "同步"
      scenarios:
        - "配置数据存储"
        - "历史数据保存"
        - "参数持久化"
        - "故障信息记录"

  # 设计模式定义
  design_patterns:
    - name: "单组件数据处理模式"
      components:
        - "APPLICATION-SW-COMPONENT-TYPE"
      interfaces:
        - "SENDER-RECEIVER-INTERFACE"
      scenarios:
        - "简单数据处理"
        - "单一功能实现"
        - "基础算法处理"

    - name: "多组件协作模式"
      components:
        - "APPLICATION-SW-COMPONENT-TYPE"
        - "SENSOR-ACTUATOR-SW-COMPONENT-TYPE"
      interfaces:
        - "SENDER-RECEIVER-INTERFACE"
        - "CLIENT-SERVER-INTERFACE"
      scenarios:
        - "复杂系统设计"
        - "多功能协作"
        - "分布式处理"

    - name: "传感器数据融合模式"
      components:
        - "SENSOR-ACTUATOR-SW-COMPONENT-TYPE"
        - "APPLICATION-SW-COMPONENT-TYPE"
        - "COMPOSITION-SW-COMPONENT-TYPE"
      interfaces:
        - "SENDER-RECEIVER-INTERFACE"
        - "CLIENT-SERVER-INTERFACE"
      scenarios:
        - "多传感器数据融合"
        - "复杂数据处理链"
        - "智能决策系统"

    - name: "参数化配置模式"
      components:
        - "APPLICATION-SW-COMPONENT-TYPE"
        - "PARAMETER-SW-COMPONENT-TYPE"
      interfaces:
        - "CLIENT-SERVER-INTERFACE"
        - "NV-DATA-INTERFACE"
      scenarios:
        - "可配置系统"
        - "参数化设计"
        - "自适应系统"

# ===== 系统配置 =====
debug_mode: true                                    # 调试模式开关
output_dir: "src/llm_generation/output"                # 输出文件目录（相对于项目根目录）