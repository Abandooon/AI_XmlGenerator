# 🔥 新增：提示词配置 - 便于调试和实验
prompts:
  # 基础组件级生成提示词
  component_level: |
    Generate XML based on the following AUTOSAR APPLICATION-SW-COMPONENT-TYPE example. 
    Note that the tags may not match the actual ones. Align the tags and correct them according to your allowtoken. 
    They must be consistent with the design concept and values of the example XML and must comply with the tokens specified by guided_grammar and guided_choice.
    If there are no errors in the tags, generate them as is without modification. 
    Requirements:
    - Start with <APPLICATION-SW-COMPONENT-TYPE> tag
    - End with </APPLICATION-SW-COMPONENT-TYPE>

    Example XML: 
        <APPLICATION-SW-COMPONENT-TYPE>
          <SHORT-NAME>ASW_COM_STD</SHORT-NAME>
          <PORTS>
            <!-- 2 Provided -->
            <P-PORT-PROTOTYPE>
              <SHORT-NAME>PPort_MCU01_EmergShutDown</SHORT-NAME>
              <PROVIDED-INTERFACE-TREF DEST="SENDER-RECEIVER-INTERFACE">
                /Interface/SR_Interface_MCU01_EmergShutDown
              </PROVIDED-INTERFACE-TREF>
            </P-PORT-PROTOTYPE>
            <P-PORT-PROTOTYPE>
              <SHORT-NAME>PPort_MCU02_MaxTor</SHORT-NAME>
              <PROVIDED-INTERFACE-TREF DEST="SENDER-RECEIVER-INTERFACE">
                /Interface/SR_Interface_MCU02_MaxTor
              </PROVIDED-INTERFACE-TREF>
            </P-PORT-PROTOTYPE>
            <!-- 1 Required -->
            <R-PORT-PROTOTYPE>
              <SHORT-NAME>RPort_HCU01_TqCmd</SHORT-NAME>
              <REQUIRED-COM-SPECS>
                <NONQUEUED-RECEIVER-COM-SPEC>
                  <DATA-ELEMENT-REF DEST="VARIABLE-DATA-PROTOTYPE">
                    /Interface/SR_Interface_HCU01_TqCmd/HCU01_Tq_Cmd
                  </DATA-ELEMENT-REF>
                  <ALIVE-TIMEOUT>0.3</ALIVE-TIMEOUT>
                  <HANDLE-TIMEOUT-TYPE>NONE</HANDLE-TIMEOUT-TYPE>
                </NONQUEUED-RECEIVER-COM-SPEC>
              </REQUIRED-COM-SPECS>
              <REQUIRED-INTERFACE-TREF DEST="SENDER-RECEIVER-INTERFACE">
                /Interface/SR_Interface_HCU01_TqCmd
              </REQUIRED-INTERFACE-TREF>
            </R-PORT-PROTOTYPE>
          </PORTS>
          <INTERNAL-BEHAVIORS>
            <SWC-INTERNAL-BEHAVIOR>
              <SHORT-NAME>IB_ASW_COM_STD</SHORT-NAME>
              <EVENTS>
                <TIMING-EVENT>
                  <SHORT-NAME>TE_RE_COM_SWC</SHORT-NAME>
                  <START-ON-EVENT-REF DEST="RUNNABLE-ENTITY">/RUNNABLES/RE_COM_SWC</START-ON-EVENT-REF>
                  <PERIOD>0.01</PERIOD> <!-- 10 ms -->
                </TIMING-EVENT>
              </EVENTS>
              <RUNNABLES>
                <RUNNABLE-ENTITY>
                  <SHORT-NAME>RE_COM_SWC</SHORT-NAME>
                </RUNNABLE-ENTITY>
              </RUNNABLES>
            </SWC-INTERNAL-BEHAVIOR>
          </INTERNAL-BEHAVIORS>
        </APPLICATION-SW-COMPONENT-TYPE>
    
    Generate complete XML now:

  # 实验性：带示例XML的提示词
  with_example_xml: |
    Based on the following task: {task}
    
    Use FSM and GBNF constraints to align and correct the XML structure.
    Focus on tag alignment and structural correction.
    
    Expected XML example:
    {example_xml}
    
    Generate corrected AUTOSAR component:

  # 调试用简化提示词
  debug_simple: |
    Task: {task}
    Generate AUTOSAR APPLICATION-SW-COMPONENT-TYPE with proper structure.
    Use constraints for tag alignment and correction.

# 🔥 约束策略配置
constraint_strategy:
  # 可选值: "gbnf_priority", "enhanced_fsm", "gad_enhanced_fsm"
  mode: "gad_enhanced_fsm"  # 使用GAD策略

  # GAD增强FSM策略配置
  gad_enhanced_fsm:
    enabled: true
    efg_threshold: 0.35              # EFG最低阈值
    max_candidates: 15              # 最大候选token数
    adaptive_threshold: true        # 自适应阈值
    temperature_scaling: 0.6        # 温度缩放

    efg_weights:                    # EFG权重配置
      gbnf: 0.3                   # GBNF语法权重
      complexity: 0.3              # 复杂度权重
      structural: 0.4              # 结构权重

    fusion_strategy: "multiplicative"  # 融合策略
    cache_size: 10000              # 缓存大小
    cache_decay: 0.95              # 缓存衰减因子
    max_iterations: 25             # 最大迭代次数

  enhanced_fsm:
    enabled: true
    max_iterations: 100        # 迭代次数
    max_tokens_per_step: 600  # 每步生成量
    temperature: 0.4          # 创造性水平
    top_p: 0.85
    thinking_enabled: true    # 启用vLLM思考
    choice_range: 30          # 每次给vLLM的选择数量

  # GBNF优先策略配置
  gbnf_priority:
    enabled: true
    use_enhanced_grammar: true
    temperature: 0.2
    max_tokens: 8000
    stop_conditions: ["</APPLICATION-SW-COMPONENT-TYPE>"]

## 生成参数配置-------------------
generation:
  default_max_tokens: 8000
  default_temperature: 0.3
  default_top_p: 0.9
  default_frequency_penalty: 0.1
  default_presence_penalty: 0.1

# 约束引用配置
constraint_references:
  fsm_ref: "autosar"
  gbnf_ref: "autosar"

# 🔥 输出配置
output:
  save_raw_outputs: true
  outputs_dir: "./outputs"
  create_timestamp_dirs: true
  save_intermediate_steps: false

# 调试配置
debug:
  enabled: false
  save_raw_outputs: true  # 🔥 强制保存原始输出
  save_debug_files: false
  console_logging: true

# 本地验证配置
local_validation:
  enabled: false
  validation_level: "simple"
  artifacts_dir: "./src/constraint_graph/artifacts"

# 🔥 移除后处理配置
post_processing:
  enabled: false  # 🔥 禁用所有后处理
  xml_wrapping: false
  fallback_templates: false
  structure_completion: false

# 约束传输配置（兼容性保留）
constraint_transmission:
  include_fsm: false
  include_gbnf: false
  include_allowed_tokens: false

# 约束级别配置（兼容性保留）
constraint_levels:
  simple:
    gbnf_enabled: false
    fsm_enabled: false
    description: "No constraints, fastest generation"

  mixed:
    gbnf_enabled: true
    fsm_enabled: true
    description: "Balanced constraints using configured strategy"

  full:
    gbnf_enabled: true
    fsm_enabled: true
    domain_constraints: true
    description: "Maximum constraint enforcement"

# 性能配置---v1
performance:
  concurrent_requests: 1
  request_timeout: 300
  constraint_cache_size: 10

# 监控配置
monitoring:
  enabled: false

# 日志配置
logging:
  level: "INFO"
  file: "./logs/autosar_constraints.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


# 形式化验证模块配置-------------------------------------------------------------------------------------------------------------------------------------------------------------------
file_paths:
  # XML实例文件
  xml_instances:
    - "xml_instance/ASW_COM.arxml"

  # 验证相关文件
  xsd_schema: "src/constraint_graph/artifacts/schema/AUTOSAR_4-2-2.xsd"
  shacl_shapes: "src/constraint_graph/artifacts/shapes/autosar_shapes.ttl"
  smt_template: "src/constraint_graph/artifacts/smt/constraints.smt2"

  enriched_constraints: "src/constraint_graph/artifacts/enriched_constraints.json"
  raw_attributes: "src/constraint_graph/artifacts/raw/raw_attributes.jsonl"  # 确保路径正确

  # 输出目录
  output_dir: "logs"
  report_dir: "reports"

# 验证器配置
validators:
  structure:
    enabled: true
    strict_mode: true

  semantic:
    enabled: false
    inference: true

  constraint:
    enabled: true
    timeout: 120
    solver: "z3"
    max_constraints_display: 5

    # 🔧 新增：约束验证细粒度控制
    validation_scope:
      # 约束来源控制
      structural_constraints: false      # 来自XSD/Schema的结构约束
      semantic_constraints: true        # 来自业务逻辑的语义约束

      # 语义约束类型细分控制
      semantic_types:
        existence: true                 # 存在性约束 (元素必须/不得存在)
        value_restriction: true         # 值限制约束 (枚举值、格式等)
        cardinality: true              # 基数约束 (出现次数限制)
        dependency: true               # 依赖关系约束 (if-then逻辑)
        mutual_exclusion: true         # 互斥约束 (不能同时存在)
        format: true                   # 格式约束 (正则表达式等)
        range: true                    # 范围约束 (数值范围)
        behavioral: true               # 行为约束 (时序、状态等)
        other: false                   # 其他未分类约束

    # 🔧 新增：约束验证策略
    validation_strategy:
      # 验证模式
      mode: "hybrid"                   # "structural_only", "semantic_only", "hybrid"

      # 失败策略
      fail_fast: false                  # 遇到第一个结构约束失败就停止
      continue_on_semantic_fail: true  # 语义约束失败时继续验证

      # 严重性过滤
      severity_filter:
        structural: ["violation"]      # 结构约束: 只处理违规
        semantic: ["violation", "warning", "info"]  # 语义约束: 处理所有级别

    # 🔧 新增：性能和输出控制
    performance:
      parallel_execution: false        # 并行执行约束验证
      max_parallel_constraints: 4      # 最大并行约束数
      memory_limit_mb: 512             # 内存限制

    output:
      detailed_breakdown: true         # 详细的约束类型分解
      show_satisfied_constraints: false # 是否显示满足的约束
      group_by_type: true             # 按类型分组显示结果
      include_smt_code: false         # 是否包含生成的SMT代码

# 验证模式定义
validation_modes:
  quick: ["structure"]
  standard: ["structure", "semantic"]
  full: ["structure", "semantic", "constraint"]

  # 🔧 新增：约束专用模式
  constraint_only: ["constraint"]
  semantic_constraint: ["constraint"]  # 将通过constraint配置控制只验证semantic
  structural_constraint: ["constraint"] # 将通过constraint配置控制只验证structural

# 报告配置
reporting:
  console_output: true
  save_reports: true
  format: "text"  # "text", "json", "both"

  # 🔧 新增：约束验证报告配置
  constraint_reporting:
    summary_only: false              # 只显示摘要
    include_smt_details: false       # 包含SMT求解细节
    breakdown_by_type: true          # 按类型分解报告
    show_constraint_source: true     # 显示约束来源
    max_violations_per_type: 20      # 每种类型最多显示的违规数

# 依赖检查配置
dependencies:
  required_packages:
    - "xmlschema"
    - "rdflib"
    - "pyshacl"
    - "pyyaml"
  optional_packages:
    - "z3-solver"  # SMT验证需要

# 自动安装配置
auto_setup:
  create_missing_directories: true
  install_missing_packages: false  # 在PyCharm中手动安装
  download_z3_if_missing: false    # 在PyCharm中手动安装


