  # 实验性：带示例XML的提示词
  with_example_xml: |
    Based on the following task: {task}
    
    Use FSM and GBNF constraints to align and correct the XML structure.
    Focus on tag alignment and structural correction.
    
    Expected XML example:
    {example_xml}
    
    Generate corrected AUTOSAR component:

  # 调试用简化提示词
  debug_simple: |
    Task: {task}
    Generate AUTOSAR APPLICATION-SW-COMPONENT-TYPE with proper structure.
    Use constraints for tag alignment and correction.

# 🔥 约束策略配置
constraint_strategy:
  # 可选值: "gbnf_priority", "iterative_fsm", "hybrid", "unconstrained"
  mode: "iterative_fsm"

  # GBNF优先策略配置
  gbnf_priority:
    enabled: true
    use_enhanced_grammar: true
    temperature: 0.2
    max_tokens: 8000
    stop_conditions: ["</APPLICATION-SW-COMPONENT-TYPE>"]

  # 迭代FSM策略配置
  iterative_fsm:
    enabled: true
    max_iterations: 20
    tokens_per_step: 100
    step_max_tokens: 200
    temperature: 0.0
    continue_threshold: 5

  # 混合策略配置
  hybrid:
    enabled: true
    primary_method: "gbnf"
    fallback_method: "fsm"
    conflict_resolution: "primary_wins"
    temperature: 0.15
    max_tokens: 8000

# 生成参数配置
generation:
  default_max_tokens: 8000
  default_temperature: 0.3
  default_top_p: 0.9
  default_frequency_penalty: 0.1
  default_presence_penalty: 0.1

# 约束引用配置
constraint_references:
  fsm_ref: "autosar"
  gbnf_ref: "autosar"

# 🔥 输出配置
output:
  save_raw_outputs: true
  outputs_dir: "./outputs"
  create_timestamp_dirs: true
  save_intermediate_steps: false

# 调试配置
debug:
  enabled: false
  save_raw_outputs: true  # 🔥 强制保存原始输出
  save_debug_files: false
  console_logging: true

# 本地验证配置
local_validation:
  enabled: false
  validation_level: "simple"
  artifacts_dir: "./src/constraint_graph/artifacts"

# 🔥 移除后处理配置
post_processing:
  enabled: false  # 🔥 禁用所有后处理
  xml_wrapping: false
  fallback_templates: false
  structure_completion: false

# 约束传输配置（兼容性保留）
constraint_transmission:
  include_fsm: false
  include_gbnf: false
  include_allowed_tokens: false

# 约束级别配置（兼容性保留）
constraint_levels:
  simple:
    gbnf_enabled: false
    fsm_enabled: false
    description: "No constraints, fastest generation"

  mixed:
    gbnf_enabled: true
    fsm_enabled: true
    description: "Balanced constraints using configured strategy"

  full:
    gbnf_enabled: true
    fsm_enabled: true
    domain_constraints: true
    description: "Maximum constraint enforcement"

# 性能配置
performance:
  concurrent_requests: 1
  request_timeout: 300
  constraint_cache_size: 10

# 监控配置
monitoring:
  enabled: false

# 日志配置
logging:
  level: "INFO"
  file: "./logs/autosar_constraints.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


# 文件路径配置 - 从配置中读取，避免硬编码
file_paths:
  # XML实例文件
  xml_instances:
    - "xml_instance/ASW_COM.arxml"

  # 验证相关文件
  xsd_schema: "src/constraint_graph/artifacts/schema/AUTOSAR_4-2-2.xsd"
  shacl_shapes: "src/constraint_graph/artifacts/shapes/autosar_shapes.ttl"
  smt_template: "src/constraint_graph/artifacts/smt/constraints.smt2"

  # 输出目录
  output_dir: "logs"
  report_dir: "reports"

# 验证器配置
validators:
  structure:
    enabled: false
    timeout: 30
    fallback_to_basic: false  # XSD验证失败时降级到基本XML验证

  semantic:
    enabled: true
    timeout: 60
    inference_type: "rdfs"
    max_violations_display: 5

  constraint:
    enabled: true
    timeout: 120
    solver: "z3"
    max_constraints_display: 5

# 验证级别配置
validation_modes:
  quick: ["structure"]  # 只进行结构验证
  standard: ["structure", "semantic"]  # 结构+语义验证
  full: ["structure", "semantic", "constraint"]  # 三段式完整验证

# 默认验证模式
default_mode: "full"

# 报告配置
reporting:
  format: "text"  # 可选: text, json, html
  detailed_errors: true
  save_reports: true
  console_output: true

# 依赖检查配置
dependencies:
  required_packages:
    - "xmlschema"
    - "rdflib"
    - "pyshacl"
    - "pyyaml"
  optional_packages:
    - "z3-solver"  # SMT验证需要

# 自动安装配置
auto_setup:
  create_missing_directories: true
  install_missing_packages: false  # 在PyCharm中手动安装
  download_z3_if_missing: false    # 在PyCharm中手动安装



