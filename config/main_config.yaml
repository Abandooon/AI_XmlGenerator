# config/main_config.yaml - 支持约束策略选择和提示词配置
project:
  name: "AUTOSAR vLLM Client with Multiple Constraint Strategies"
  version: "3.0.0"
  description: "Local client for AUTOSAR XML generation with configurable constraints"

# vllm云端服务配置----------------------------------------------------------------------------------------------------------------------------------

cloud_service:
  internal_endpoint: "http://117.50.217.52:8000"
  api_type: "enhanced"
  model_name: "/model/HuggingFace/deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
  timeout: 600
  max_retries: 3
  retry_delay: 5

