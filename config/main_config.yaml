# 🔥 新增：提示词配置 - 便于调试和实验
prompts:
  # 基础组件级生成提示词
  component_level: |
    Generate XML based on the following AUTOSAR APPLICATION-SW-COMPONENT-TYPE example. 
    Note that the tags may not match the actual ones. Align the tags and correct them according to your allowtoken. 
    They must be consistent with the design concept and values of the example XML and must comply with the tokens specified by guided_grammar and guided_choice.
    If there are no errors in the tags, generate them as is without modification. 
    Requirements:
    - Start with <APPLICATION-SW-COMPONENT-TYPE> tag
    - End with </APPLICATION-SW-COMPONENT-TYPE>

    Example XML: 
        <APPLICATION-SW-COMPONENT-TYPE>
          <SHORT-NAME>ASW_COM_MIN</SHORT-NAME>
          <PORTS>
            <P-PORT-PROTOTYPE>
              <SHORT-NAME>PPort_MCU01_EmergShutDown</SHORT-NAME>
              <PROVIDED-INTERFACE-TREF DEST="SENDER-RECEIVER-INTERFACE">/Interface/SR_Interface_MCU01_EmergShutDown
              </PROVIDED-INTERFACE-TREF>
            </P-PORT-PROTOTYPE>
          </PORTS>
        </APPLICATION-SW-COMPONENT-TYPE>

    
    Generate complete XML now:

    Create complete, well-structured XML:
  # 实验性：带示例XML的提示词
  with_example_xml: |
    Based on the following task: {task}
    
    Use FSM and GBNF constraints to align and correct the XML structure.
    Focus on tag alignment and structural correction.
    
    Expected XML example:
    {example_xml}
    
    Generate corrected AUTOSAR component:

  # 调试用简化提示词
  debug_simple: |
    Task: {task}
    Generate AUTOSAR APPLICATION-SW-COMPONENT-TYPE with proper structure.
    Use constraints for tag alignment and correction.

# 🔥 约束策略配置
constraint_strategy:
  # 可选值: "gbnf_priority", "enhanced_fsm", "gad_enhanced_fsm"
  mode: "enhanced_fsm"  # 使用GAD策略

  # 块级FSM策略配置
  block_level_fsm:
    # 最大块数限制
    max_blocks: 10

    # LLM生成参数
    temperature: 0.3        # 较低的温度保证稳定性
    top_p: 0.9             # 采样参数

    # 验证和重试
    block_validation: true  # 启用块验证
    retry_on_failure: true  # 失败时重试

    # 结构规划
    structure_planning: true  # 启用智能结构规划

    # 块定义优先级和必需性
    block_definitions:
      header_block:
        priority: 1
        required: true
        description: "组件头部信息，包括名称和管理数据"

      ports_block:
        priority: 2
        required: false
        description: "端口定义块，包括P-PORT和R-PORT"

      behaviors_block:
        priority: 3
        required: false
        description: "内部行为定义，包括事件和可运行实体"

    # 块生成策略
    generation_strategy:
      # 是否并行生成独立块
      parallel_blocks: false

      # 块间依赖处理
      handle_dependencies: true

      # 上下文窗口大小（用于块生成时的上下文）
      context_window: 500

      # 最大重试次数
      max_retries: 2

    # 性能优化
    optimization:
      # 缓存已生成的块模板
      cache_templates: true

      # 预测下一个块
      predictive_generation: true

      # 自适应块大小
      adaptive_block_size: true
      min_block_size: 100    # 字符
      max_block_size: 1000   # 字符

  # GAD增强FSM策略配置
  gad_enhanced_fsm:
    enabled: true
    efg_threshold: 0.25              # EFG最低阈值
    max_candidates: 25              # 最大候选token数
    adaptive_threshold: true        # 自适应阈值
    temperature_scaling: 0.7        # 温度缩放

    # 🔥 调整EFG权重 - 降低结构权重，提高语法权重
    efg_weights:
      structural: 0.3              # 降低FSM结构权重
      grammatical: 0.5             # 提高GBNF语法权重
      contextual: 0.2              # 保持上下文权重

    # 🔥 新增：重复检测配置
    repetition_control:
      enabled: true
      semantic_analysis: true        # 启用语义分析
      default_allow_repetition: true # 默认允许重复

    # 🔥 新增：完成条件配置
    completion_control:
      min_xml_length: 200           # 最小XML长度
      min_depth_reached: 3          # 最小路径深度
      require_multiple_elements: true # 要求多个元素

    fusion_strategy: "weighted_sum"   # 🔥 改为加权求和
    cache_size: 15000                # 增加缓存
    cache_decay: 0.97                # 减少衰减

  enhanced_fsm:
    enabled: true
    max_iterations: 100        # 迭代次数
    max_tokens_per_step: 600  # 每步生成量
    temperature: 0.4          # 创造性水平
    top_p: 0.85
    thinking_enabled: true    # 启用vLLM思考
    choice_range: 30          # 每次给vLLM的选择数量

  # GBNF优先策略配置
  gbnf_priority:
    enabled: true
    use_enhanced_grammar: true
    temperature: 0.2
    max_tokens: 8000
    stop_conditions: ["</APPLICATION-SW-COMPONENT-TYPE>"]

## 生成参数配置-------------------
generation:
  default_max_tokens: 8000
  default_temperature: 0.3
  default_top_p: 0.9
  default_frequency_penalty: 0.1
  default_presence_penalty: 0.1

# 约束引用配置
constraint_references:
  fsm_ref: "autosar"
  gbnf_ref: "autosar"

# 🔥 输出配置
output:
  save_raw_outputs: true
  outputs_dir: "./outputs"
  create_timestamp_dirs: true
  save_intermediate_steps: false

# 调试配置
debug:
  enabled: false
  save_raw_outputs: true  # 🔥 强制保存原始输出
  save_debug_files: false
  console_logging: true

# 本地验证配置
local_validation:
  enabled: false
  validation_level: "simple"
  artifacts_dir: "./src/constraint_graph/artifacts"

# 🔥 移除后处理配置
post_processing:
  enabled: false  # 🔥 禁用所有后处理
  xml_wrapping: false
  fallback_templates: false
  structure_completion: false

# 约束传输配置（兼容性保留）
constraint_transmission:
  include_fsm: false
  include_gbnf: false
  include_allowed_tokens: false

# 约束级别配置（兼容性保留）
constraint_levels:
  simple:
    gbnf_enabled: false
    fsm_enabled: false
    description: "No constraints, fastest generation"

  mixed:
    gbnf_enabled: true
    fsm_enabled: true
    description: "Balanced constraints using configured strategy"

  full:
    gbnf_enabled: true
    fsm_enabled: true
    domain_constraints: true
    description: "Maximum constraint enforcement"

# 性能配置---v1
performance:
  concurrent_requests: 1
  request_timeout: 300
  constraint_cache_size: 10

# 监控配置
monitoring:
  enabled: false

# 日志配置
logging:
  level: "INFO"
  file: "./logs/autosar_constraints.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


# 形式化验证模块配置-------------------------------------------------------------------------------------------------------------------------------------------------------------------
file_paths:
  # XML实例文件
  xml_instances:
    - "xml_instance/ASW_COM.arxml"
    - "xml_instance/test.arxml"

  # 验证相关文件
  xsd_schema: "src/constraint_graph/artifacts/schema/AUTOSAR_4-2-2.xsd"
  shacl_shapes: "src/constraint_graph/artifacts/shapes/autosar_shapes.ttl"
  smt_template: "src/constraint_graph/artifacts/smt/constraints.smt2"

  enriched_constraints: "src/constraint_graph/artifacts/enriched_constraints.json"
  raw_attributes: "src/constraint_graph/artifacts/raw/raw_attributes.jsonl"  # 确保路径正确

  # 输出目录
  output_dir: "logs"
  report_dir: "reports"

# 验证器配置
validators:
  # XSD 验证配置
  structure:
    enabled: true
    strict_mode: true #严格按照xsd定义

  # SHACL 🔧 增强的语义验证配置
  semantic:
    enabled: true
    inference: true
    timeout: 180
    max_violations_display: 10

    # 🔧 新增：语义验证细粒度控制
    validation_scope:
      # 验证层面控制
      structural_validation: false      # SHACL结构性验证 (基数、必需属性等)
      semantic_validation: true        # SHACL语义性验证 (值限制、依赖等)

      # 语义约束类型细分控制 - 与SMT对齐
      semantic_types:
        existence: false                 # 存在性约束 (sh:not, sh:exists)
        value_restriction: true         # 值限制约束 (sh:in, sh:hasValue)
        cardinality: true              # 基数约束 (sh:minCount, sh:maxCount)
        dependency: true               # 依赖关系约束 (sh:qualified, conditional)
        mutual_exclusion: true         # 互斥约束 (sh:xone, exclusive)
        format: true                   # 格式约束 (sh:pattern, sh:datatype)
        range: true                    # 范围约束 (sh:minInclusive, sh:maxInclusive)
        behavioral: false              # 行为约束 (时序、状态相关)
        other: true                    # 其他未分类约束

    # 🔧 新增：验证策略
    validation_strategy:
      # 验证模式
      mode: "hybrid"                   # "structural_only", "semantic_only", "hybrid"

      # 失败策略
      fail_fast: false                # SHACL通常不需要快速失败
      continue_on_violation: true      # 结构违规时继续验证

      # 严重性过滤
      severity_filter:
        structural: ["violation"]      # 结构验证: 只处理违规
        semantic: ["violation", "warning", "info"]  # 语义验证: 处理所有级别

    # 🔧 新增：性能和输出控制
    performance:
      parallel_shapes: false           # 并行形状验证
      max_parallel_shapes: 2           # 最大并行形状数
      memory_limit_mb: 1024           # 内存限制
      inference_timeout: 60           # 推理超时

    output:
      detailed_breakdown: true         # 详细的违规类型分解
      show_satisfied_shapes: false     # 是否显示满足的形状
      group_by_type: true             # 按类型分组显示结果
      include_rdf_triples: false      # 是否包含RDF三元组信息
      xml_element_mapping: true       # 显示XML元素映射

  # SMT 约束验证配置 - 与SHACL配置对齐
  constraint:
    enabled: true
    timeout: 120
    solver: "z3"
    max_constraints_display: 5

    validation_scope:
      structural_constraints: true     # SMT结构约束
      semantic_constraints: true       # SMT语义约束

      # 与SHACL语义类型保持一致
      semantic_types:
        existence: true
        value_restriction: true
        cardinality: true
        dependency: true
        mutual_exclusion: true
        format: true
        range: true
        behavioral: true
        other: false

    validation_strategy:
      mode: "hybrid"                  # 与SHACL模式保持一致
      fail_fast: true
      continue_on_semantic_fail: true

      severity_filter:
        structural: ["violation"]
        semantic: ["violation", "warning"]

# 🔧 新增：验证模式定义 - 支持细粒度控制
validation_modes:
  quick: ["structure"]
  standard: ["structure", "semantic"]
  full: ["structure", "semantic", "constraint"]

  # 结构验证专用模式
  structure_only: ["structure"]

  # 语义验证专用模式
  semantic_structural: ["semantic"]   # 仅SHACL结构验证
  semantic_content: ["semantic"]      # 仅SHACL语义验证
  semantic_full: ["semantic"]         # 完整SHACL验证

  # 约束验证专用模式
  constraint_structural: ["constraint"]  # 仅SMT结构约束
  constraint_semantic: ["constraint"]    # 仅SMT语义约束
  constraint_full: ["constraint"]        # 完整SMT约束验证

  # 混合模式
  structural_focus: ["structure", "semantic", "constraint"]  # 结构重点模式
  semantic_focus: ["semantic", "constraint"]                 # 语义重点模式

  # 🔧 增强的报告配置
  reporting:
    console_output: true
    save_reports: true
    format: "text"  # "text", "json", "both"

    # SHACL验证报告配置
    semantic_reporting:
      summary_only: false              # 只显示摘要
      include_rdf_details: false       # 包含RDF转换细节
      breakdown_by_type: true          # 按约束类型分解报告
      show_shape_source: true          # 显示SHACL形状来源
      max_violations_per_type: 10      # 每种类型最多显示的违规数
      xml_element_tracing: true        # XML元素追踪

    # SMT约束验证报告配置
    constraint_reporting:
      summary_only: false              # 只显示摘要
      include_smt_details: false       # 包含SMT求解细节
      breakdown_by_type: true          # 按类型分解报告
      show_constraint_source: true     # 显示约束来源
      max_violations_per_type: 10      # 每种类型最多显示的违规数


