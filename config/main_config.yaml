# config/main_config.yaml - 支持约束策略选择
project:
  name: "AUTOSAR vLLM Client with Multiple Constraint Strategies"
  version: "3.0.0"
  description: "Local client for AUTOSAR XML generation with configurable constraints"

# 云端服务配置
cloud_service:
  internal_endpoint: "http://117.50.173.128:8000"
  api_type: "enhanced"
  model_name: "/model/HuggingFace/deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
  timeout: 120
  max_retries: 3
  retry_delay: 5

# 🔥 新增：约束策略配置
constraint_strategy:
  # 可选值: "gbnf_priority", "iterative_fsm", "hybrid", "unconstrained"
  mode: "gbnf_priority"

  # GBNF优先策略配置
  gbnf_priority:
    enabled: true
    use_enhanced_grammar: true
    temperature: 0.2
    max_tokens: 8000
    stop_conditions: ["</APPLICATION-SW-COMPONENT-TYPE>"]

  # 迭代FSM策略配置
  iterative_fsm:
    enabled: true
    max_iterations: 8
    tokens_per_step: 100
    step_max_tokens: 200
    temperature: 0.1
    continue_threshold: 5  # 最小输出长度才继续下一步

  # 混合策略配置
  hybrid:
    enabled: true
    primary_method: "gbnf"  # "gbnf" 或 "fsm"
    fallback_method: "fsm"  # "fsm" 或 "gbnf"
    conflict_resolution: "primary_wins"  # "primary_wins" 或 "merge"
    temperature: 0.15
    max_tokens: 8000

# 生成参数配置
generation:
  default_max_tokens: 8000
  default_temperature: 0.3
  default_top_p: 0.9
  default_frequency_penalty: 0.1
  default_presence_penalty: 0.1

# 约束引用配置
constraint_references:
  fsm_ref: "autosar"
  gbnf_ref: "autosar"

# 调试配置
debug:
  enabled: false  # 🔥 关闭调试文件输出
  save_raw_outputs: false
  save_debug_files: false
  console_logging: true

# 本地验证配置
local_validation:
  enabled: false
  validation_level: "simple"
  artifacts_dir: "./src/constraint_graph/artifacts"

# 约束传输配置（兼容性保留）
constraint_transmission:
  include_fsm: false
  include_gbnf: false
  include_allowed_tokens: false

# 约束级别配置（兼容性保留）
constraint_levels:
  simple:
    gbnf_enabled: false
    fsm_enabled: false
    description: "No constraints, fastest generation"

  mixed:
    gbnf_enabled: true
    fsm_enabled: true
    description: "Balanced constraints using configured strategy"

  full:
    gbnf_enabled: true
    fsm_enabled: true
    domain_constraints: true
    description: "Maximum constraint enforcement"

# 性能配置
performance:
  concurrent_requests: 1
  request_timeout: 180  # 增加超时以支持迭代策略
  constraint_cache_size: 10

# 监控配置
monitoring:
  enabled: false

# 日志配置
logging:
  level: "INFO"
  file: "./logs/autosar_constraints.log"
  console: true
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"


